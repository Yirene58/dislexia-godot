services:
  db:
    image: postgres:16-alpine
    container_name: dislexia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dislexia_db
      POSTGRES_USER: rpg_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpg_user -d dislexia_db"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: dislexia-backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DATABASE_URL: postgresql://rpg_user:${POSTGRES_PASSWORD}@db:5432/dislexia_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: dislexia-frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
